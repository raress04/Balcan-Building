<!doctype html>
<html lang="ro">

<head>
    <meta charset="UTF-8" />
    <title>Balcan Building SRL</title>
    <script>
        // SPA routing fallback for GitHub Pages / static hosts
        // When a user hits a direct URL (e.g. /services), the server returns 404.
        // This script rewrites the URL and redirects to index.html so React Router can handle it.
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.host + '/' +
            l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
